<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1F7A"/>
      <stop offset="100%" stop-color="#4B39C9"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FCE85"/>
      <stop offset="100%" stop-color="#0C8C4C"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FF"/>
      <stop offset="100%" stop-color="#D6DCF5"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- four corner connector nodes + lines, evoking a provider "plugging into" infra -->
  <g stroke="#9C8CFF" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="120" x2="176" y2="176"/>
    <line x1="392" y1="120" x2="336" y2="176"/>
    <line x1="120" y1="392" x2="176" y2="336"/>
    <line x1="392" y1="392" x2="336" y2="336"/>
  </g>
  <g fill="#B9AEFF">
    <circle cx="112" cy="112" r="14"/>
    <circle cx="400" cy="112" r="14"/>
    <circle cx="112" cy="400" r="14"/>
    <circle cx="400" cy="400" r="14"/>
  </g>

  <!-- database cylinder -->
  <g>
    <path d="M 176 232 L 176 336 C 176 356 211 372 256 372 C 301 372 336 356 336 336 L 336 232 Z" fill="url(#cyl)"/>
    <ellipse cx="256" cy="336" rx="80" ry="30" fill="#C3CBF0"/>
    <ellipse cx="256" cy="284" rx="80" ry="30" fill="none" stroke="#B0B8E8" stroke-width="4"/>
    <ellipse cx="256" cy="232" rx="80" ry="30" fill="url(#cyl)" stroke="#E9ECFB" stroke-width="2"/>
  </g>

  <!-- mongo-style leaf, rising from the cylinder's top -->
  <path d="M 256 232
           C 224 208 220 158 244 116
           C 258 140 264 152 264 176
           C 280 156 282 132 272 104
           C 300 128 308 168 292 200
           C 284 216 270 226 256 232 Z"
        fill="url(#leaf)"/>
  <line x1="256" y1="232" x2="256" y2="196" stroke="#0C8C4C" stroke-width="5" stroke-linecap="round"/>
</svg>
